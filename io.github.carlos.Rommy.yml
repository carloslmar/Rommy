app-id: io.github.carlos.Rommy
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: rommy
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: rommy
    buildsystem: simple
    build-commands:
      - install -d /app/share/rommy
      - cp -r rommyapp /app/share/rommy/
      - install -Dm755 rommy /app/bin/rommy
      - install -Dm644 io.github.carlos.Rommy.desktop /app/share/applications/io.github.carlos.Rommy.desktop
      - if [ -f rommy.png ]; then install -Dm644 rommy.png /app/share/icons/hicolor/256x256/apps/io.github.carlos.Rommy.png; fi
    sources:
      - type: dir
        path: .